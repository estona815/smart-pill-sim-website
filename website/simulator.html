<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PILLCARE | 한 알 배출 쇼케이스</title>
    <meta
      name="description"
      content="실제 프로토타입 사진 위에서 약 한 알이 컵으로 떨어지는 흐름을 영상처럼 보여주는 발표용 쇼케이스"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 55 17.5v29L32 60 9 46.5v-29Z' fill='none' stroke='%23f4f8ff' stroke-width='4'/%3E%3Cpath d='M22 44V20l20 24V20' fill='none' stroke='%23f4f8ff' stroke-linecap='round' stroke-linejoin='round' stroke-width='5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./simulator.css" />
  </head>
  <body>
    <main class="sim-page">
      <header class="topbar">
        <a class="brand" href="./index.html" aria-label="Nutronics 메인 페이지">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <path
                d="M32 4 55 17.5v29L32 60 9 46.5v-29Z"
                fill="none"
                stroke="currentColor"
                stroke-width="4"
              />
              <path
                d="M22 44V20l20 24V20"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="5"
              />
            </svg>
          </span>
          <span>
            <strong>스마트 캡슐 디스펜서</strong>
            <small>한 알 배출 쇼케이스</small>
          </span>
        </a>

        <nav class="top-actions" aria-label="페이지 이동">
          <a href="./index.html">메인</a>
        </nav>
      </header>

      <section class="hero">
        <div class="stage-wrap">
          <div id="dispense-stage" class="dispense-stage" data-phase="idle">
            <img
              class="structure-photo"
              src="./assets/optimized/current-structure.webp"
              alt="현재 제작 중인 스마트 캡슐 디스펜서 프로토타입 구조"
              width="1600"
              height="2133"
              decoding="async"
              fetchpriority="high"
            />

            <div class="stage-copy">
              <span class="eyebrow">Live Demo</span>
              <h1>약이 컵에 떨어지는 순간</h1>
              <p id="stage-caption">약통에서 한 알이 준비됩니다.</p>
            </div>

            <svg class="flow-svg" viewBox="0 0 100 100" aria-hidden="true">
              <path
                class="flow-shadow"
                d="M75 30 C70 34 68 38 66 43 C61 48 55 51 51 58 C48 63 49 69 52 75"
              />
              <path
                id="flow-path"
                class="flow-path"
                d="M75 30 C70 34 68 38 66 43 C61 48 55 51 51 58 C48 63 49 69 52 75"
                pathLength="100"
              />
            </svg>

            <div class="focus-point source-point">
              <span></span>
              약통
            </div>
            <div class="focus-point gate-point">
              <span></span>
              한 알 선택
            </div>
            <div class="focus-point chute-point">
              <span></span>
              아래 통로
            </div>
            <div class="focus-point cup-point">
              <span></span>
              컵
            </div>

            <div class="rotor" aria-hidden="true">
              <span></span>
            </div>
            <div id="capsule" class="capsule" aria-hidden="true"></div>
            <div id="drop-flash" class="drop-flash" aria-hidden="true"></div>
            <div id="done-mark" class="done-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </div>

            <div class="controls" aria-label="시뮬레이션 제어">
              <button id="play-button" class="primary-button" type="button">재생</button>
              <button id="replay-button" class="icon-button" type="button" aria-label="처음부터 다시 보기">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7v6h6" />
                  <path d="M5 13a7 7 0 1 0 2-5" />
                </svg>
              </button>
            </div>

            <div class="film-bar" aria-hidden="true">
              <div id="film-progress" class="film-progress"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="flow-steps" aria-label="배출 흐름">
        <button class="step-pill is-active" type="button" data-step="0">
          <span>01</span>
          준비
        </button>
        <button class="step-pill" type="button" data-step="1">
          <span>02</span>
          한 알 선택
        </button>
        <button class="step-pill" type="button" data-step="2">
          <span>03</span>
          이동
        </button>
        <button class="step-pill" type="button" data-step="3">
          <span>04</span>
          컵 도착
        </button>
      </section>
    </main>

    <script src="./simulator.js"></script>
  </body>
</html>
