<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PILLCARE | 캡슐 배출 시뮬레이터</title>
    <meta
      name="description"
      content="알약통 회전, 중앙 수집, 외부 배출을 보여주는 발표용 시뮬레이터"
    />
    <link rel="preload" as="image" href="./assets/optimized/device-render.webp" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 55 17.5v29L32 60 9 46.5v-29Z' fill='none' stroke='%23f4f8ff' stroke-width='4'/%3E%3Cpath d='M22 44V20l20 24V20' fill='none' stroke='%23f4f8ff' stroke-linecap='round' stroke-linejoin='round' stroke-width='5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./simulator.css?v=stable-20260701" />
  </head>
  <body>
    <main class="simulator-shell">
      <header class="sim-header">
        <a class="brand" href="./index.html" aria-label="Nutronics 메인 페이지">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <path
                d="M32 4 55 17.5v29L32 60 9 46.5v-29Z"
                fill="none"
                stroke="currentColor"
                stroke-width="4"
              />
              <path
                d="M22 44V20l20 24V20"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="5"
              />
            </svg>
          </span>
          <span>
            <strong>Nutronics</strong>
            <small>배출 시연</small>
          </span>
        </a>

        <a class="back-link" href="./index.html">메인</a>
      </header>

      <section class="stage-area" aria-labelledby="sim-title">
        <div class="title-block">
          <h1 id="sim-title">4알 배출</h1>
          <p id="stage-caption">알약통 회전</p>
        </div>

        <div id="device-stage" class="device-stage" data-phase="ready">
          <img
            class="device-render"
            src="./assets/optimized/device-render.webp"
            alt="스마트 캡슐 디스펜서 전체 장치 렌더"
            width="1599"
            height="900"
            decoding="async"
            fetchpriority="high"
          />

          <svg
            class="path-overlay"
            viewBox="0 0 1599 900"
            preserveAspectRatio="xMidYMid slice"
            aria-hidden="true"
          >
            <defs>
              <linearGradient id="routeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#f7c44f" />
                <stop offset="48%" stop-color="#4fe0d2" />
                <stop offset="100%" stop-color="#78a8ff" />
              </linearGradient>
              <filter id="routeGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="6" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            <g class="rotors" aria-hidden="true">
              <g class="rotor" data-source="left-hopper" transform="translate(690 252) rotate(-6)">
                <ellipse rx="78" ry="37" />
                <g class="rotor-wheel">
                  <path d="M-54 0h108M0-28v56" />
                  <circle cx="-34" cy="-12" r="9" />
                  <circle cx="28" cy="12" r="9" />
                  <circle cx="4" cy="-19" r="8" />
                </g>
              </g>
              <g class="rotor" data-source="right-hopper" transform="translate(1138 252) rotate(6)">
                <ellipse rx="80" ry="38" />
                <g class="rotor-wheel">
                  <path d="M-56 0h112M0-29v58" />
                  <circle cx="-33" cy="12" r="9" />
                  <circle cx="32" cy="-12" r="9" />
                  <circle cx="6" cy="21" r="8" />
                </g>
              </g>
              <g class="rotor" data-source="left-cartridge" transform="translate(432 604) rotate(-9)">
                <ellipse rx="72" ry="35" />
                <g class="rotor-wheel">
                  <path d="M-49 0h98M0-26v52" />
                  <circle cx="-27" cy="11" r="9" />
                  <circle cx="29" cy="-10" r="9" />
                  <circle cx="7" cy="20" r="8" />
                </g>
              </g>
              <g class="rotor" data-source="front-cartridge" transform="translate(744 662) rotate(4)">
                <ellipse rx="70" ry="34" />
                <g class="rotor-wheel">
                  <path d="M-48 0h96M0-25v50" />
                  <circle cx="-30" cy="-10" r="9" />
                  <circle cx="29" cy="11" r="9" />
                  <circle cx="7" cy="-19" r="8" />
                </g>
              </g>
            </g>

            <g class="feed-shadows">
              <path d="M676 340 C716 425 758 530 800 600" />
              <path d="M1064 350 C1004 432 902 548 800 600" />
              <path d="M458 642 C560 676 704 648 800 600" />
              <path d="M732 644 C748 628 776 612 800 600" />
            </g>
            <g class="feed-routes">
              <path class="feed-route" d="M676 340 C716 425 758 530 800 600" />
              <path class="feed-route" d="M1064 350 C1004 432 902 548 800 600" />
              <path class="feed-route" d="M458 642 C560 676 704 648 800 600" />
              <path class="feed-route" d="M732 644 C748 628 776 612 800 600" />
            </g>
            <path id="out-shadow" d="M800 600 C680 650 520 646 350 606" />
            <path id="out-route" d="M800 600 C680 650 520 646 350 606" />

            <g class="station" data-step="0" transform="translate(930 318)">
              <circle r="19" />
              <text y="6">1</text>
            </g>
            <g class="station" data-step="1" transform="translate(852 500)">
              <circle r="19" />
              <text y="6">2</text>
            </g>
            <g class="station" data-step="2" transform="translate(800 600)">
              <circle r="19" />
              <text y="6">3</text>
            </g>
            <g class="station" data-step="3" transform="translate(350 606)">
              <circle r="19" />
              <text y="6">4</text>
            </g>

            <g class="moving-capsule" data-capsule="0">
              <ellipse class="capsule-shadow" cx="0" cy="10" rx="24" ry="8" />
              <g class="capsule-body">
                <rect x="-28" y="-12" width="56" height="24" rx="12" />
                <path d="M0 -12v24" />
              </g>
            </g>
            <g class="moving-capsule" data-capsule="1">
              <ellipse class="capsule-shadow" cx="0" cy="10" rx="24" ry="8" />
              <g class="capsule-body">
                <rect x="-28" y="-12" width="56" height="24" rx="12" />
                <path d="M0 -12v24" />
              </g>
            </g>
            <g class="moving-capsule" data-capsule="2">
              <ellipse class="capsule-shadow" cx="0" cy="10" rx="24" ry="8" />
              <g class="capsule-body">
                <rect x="-28" y="-12" width="56" height="24" rx="12" />
                <path d="M0 -12v24" />
              </g>
            </g>
            <g class="moving-capsule" data-capsule="3">
              <ellipse class="capsule-shadow" cx="0" cy="10" rx="24" ry="8" />
              <g class="capsule-body">
                <rect x="-28" y="-12" width="56" height="24" rx="12" />
                <path d="M0 -12v24" />
              </g>
            </g>

            <g class="arrival-flash">
              <ellipse cx="350" cy="606" rx="96" ry="38" />
              <path d="M298 586 C335 626 382 628 420 586" />
            </g>
          </svg>

          <div class="stage-controls" aria-label="시뮬레이터 제어">
            <button id="play-button" class="play-button" type="button">
              <span class="play-icon" aria-hidden="true"></span>
              <span id="play-label">재생</span>
            </button>
            <button id="replay-button" class="replay-button" type="button" aria-label="처음부터 다시 보기">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7v6h6" />
                <path d="M5 13a7 7 0 1 0 2-5" />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <section class="step-strip" aria-label="배출 단계">
        <button class="step-button is-active" type="button" data-step="0">
          <span>01</span>
          준비
        </button>
        <button class="step-button" type="button" data-step="1">
          <span>02</span>
          토출
        </button>
        <button class="step-button" type="button" data-step="2">
          <span>03</span>
          수집
        </button>
        <button class="step-button" type="button" data-step="3">
          <span>04</span>
          배출
        </button>
      </section>
    </main>

    <script src="./simulator.js?v=stable-20260701"></script>
  </body>
</html>
