<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Nutronics Project OS Mockup</title><desc id="desc">회의록, 자료, 검증 로그, GitHub 링크를 모은 발표용 목업</desc>
