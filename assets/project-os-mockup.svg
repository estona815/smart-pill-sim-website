nt-size="25" font-weight="900" fill="#7e22ce">다음 액션</text><text x="894" y="484" font-size="17" font-weight="750" fill="#334155">담당자 · 마감일 · 위험</text><text x="894" y="524" font-size="17" font-weight="750" fill="#334155">재설계 입력으로 환류</text></g>
