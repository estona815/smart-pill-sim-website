<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Nutronics Future Concept</title><desc id="desc">4통 카트리지, 7인치 터치 UI, 하단 트레이, 내부 전장 배치를 보여주는 발표용 시안</desc>
  <rect width="1280" height="720" rx="32" fill="#f7fbfd"/><rect x="42" y="38" width="1196" height="644" rx="30" fill="#fff" stroke="#dce5ef"/>
  <text x="78" y="92" font-family="system-ui, sans-serif" font-size="31" font-weight="900" fill="#061b33">Future Concept / 발표용 시안</text><text x="78" y="126" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#64748b">실물 사진 아님 · 실제 물리시험과 구분 · 실측 성공률은 장기 테스트 이후 제시</text>
  <g font-family="system-ui, sans-serif"><rect x="120" y="154" width="480" height="430" rx="38" fill="#eef5ff" stroke="#9ab8f2" stroke-width="3"/><rect x="158" y="190" width="404" height="96" rx="22" fill="#dbeafe"/><rect x="188" y="210" width="68" height="148" rx="18" fill="#dff8ef" stroke="#7bdccf"/><rect x="274" y="210" width="68" height="148" rx="18" fill="#fff4db" stroke="#f4c86a"/><rect x="360" y="210" width="68" height="148" rx="18" fill="#f4edff" stroke="#c6a6ed"/><rect x="446" y="210" width="68" height="148" rx="18" fill="#e8fff8" stroke="#7bdccf"/><text x="352" y="388" text-anchor="middle" font-size="18" font-weight="900" fill="#334155">4통 카트리지</text><rect x="188" y="420" width="330" height="86" rx="22" fill="#0f172a"/><rect x="210" y="440" width="122" height="46" rx="12" fill="#0f9f8f"/><text x="271" y="469" text-anchor="middle" font-size="16" font-weight="900" fill="#ecfeff">7-inch UI</text><circle cx="468" cy="464" r="18" fill="#22c55e"/><rect x="236" y="548" width="250" height="40" rx="20" fill="#cbd5e1"/><text x="361" y="622" text-anchor="middle" font-size="18" font-weight="900" fill="#334155">하단 배출 트레이</text></g>
  <g font-family="system-ui, sans-serif"><rect x="706" y="158" width="414" height="424" rx="28" fill="#f8fafc" stroke="#dce5ef" stroke-width="2"/><text x="746" y="214" font-size="25" font-weight="900" fill="#061b33">내부 전장 배치 시안</text><rect x="746" y="250" width="150" height="94" rx="18" fill="#e8fff8" stroke="#7bdccf"/><text x="776" y="306" font-size="19" font-weight="900" fill="#08765f">RPi5</text><rect x="934" y="250" width="150" height="94" rx="18" fill="#eef5ff" stroke="#9ab8f2"/><text x="958" y="306" font-size="19" font-weight="900" fill="#1d4ed8">PCA9685</text><rect x="746" y="380" width="150" height="94" rx="18" fill="#fff7ed" stroke="#f4c86a"/><text x="783" y="436" font-size="19" font-weight="900" fill="#b45309">SMPS</text><rect x="934" y="380" width="150" height="94" rx="18" fill="#f4edff" stroke="#c6a6ed"/><text x="966" y="436" font-size="19" font-weight="900" fill="#7e22ce">퓨즈박스</text><path d="M896 297H934M896 427H934M821 344V380M1009 344V380" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/><text x="746" y="532" font-size="17" font-weight="850" fill="#334155">전원 분기 · 공통 GND · 센서 입력을 발표용으로 요약</text></g>
  <text x="78" y="652" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#0f766e">예상 제품 형태를 설명하기 위한 시각 보조이며, 실제 제작 결과와 구분</text>
